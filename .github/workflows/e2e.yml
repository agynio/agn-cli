name: E2E

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: service

      - name: Provision cluster
        uses: agynio/e2e/.github/actions/provision-vm@main

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      # The dev pipeline shells out to `go build` on the runner, so Go has to be
      # here rather than assumed from the image.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod

      - name: Build agn from source
        working-directory: service
        run: devspace dev

      - name: Run e2e tests
        uses: agynio/e2e/.github/actions/run-tests@main
        with:
          service: agn_cli
          include_smoke: false
          agn-binary: service/dist/agn
